services:
  # ── Backend API ─────────────────────────────────────────────────
  - type: web
    name: academia-ai-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend

    # pip upgrade first prevents metadata-generation-failed on old pip
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --access-logfile -
    healthCheckPath: /api/health

    envVars:
      # ── Python version: 3.12.8 (all deps have prebuilt cp312 manylinux wheels)
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: ENV
        value: production

      # ── Database (set in Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # ── AI Keys (set in Render dashboard)
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ── Auto-generated secure secret
      - key: SECRET_KEY
        generateValue: true

      # ── pip options: only binary wheels, no source compilation, no Rust
      - key: PIP_ONLY_BINARY
        value: ":all:"
      - key: PIP_NO_BUILD_ISOLATION
        value: "0"
