services:
  # ── Backend API (Python runtime) ──────────────────────────────────
  - type: web
    name: academia-ai-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: ENV
        value: production

      # ── Database (set in Render dashboard)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

      # ── AI Keys (set in Render dashboard)
      - key: AI_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: CHAT_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: STEM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: CODING_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: VISION_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: EMBEDDING_MODEL
        value: nvidia/nv-embedqa-e5-v5
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDFLARE_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ── Auto-generated secure secret
      - key: SECRET_KEY
        generateValue: true
